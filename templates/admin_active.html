{{range .}}
<div class="card">
  <div class="row">
    <div>
      <div class="name"><span class="dot"></span>{{.Username}}</div>
      <div class="meta">{{.MACAddress}}</div>
    </div>
    <div class="row">
      <div class="meta">{{.Remaining}} left</div>
      <form hx-post="/admin/disconnect/{{.ID}}" hx-target="#active" hx-swap="innerHTML" hx-confirm="Disconnect and delete this session?">
        <button type="submit">Disconnect</button>
      </form>
    </div>
  </div>
</div>
{{else}}
<div class="card"><p class="empty">No active sessions</p></div>
{{end}}
