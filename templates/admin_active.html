{{range .}}
<div class="card">
  <div class="row">
    <div>
      <div class="name"><span class="dot"></span>{{.User}}</div>
      <div class="meta">{{.Address}} &middot; {{.MacAddr}}</div>
    </div>
    <div class="meta">{{.Uptime}}</div>
  </div>
</div>
{{else}}
<div class="card"><p class="empty">No active sessions</p></div>
{{end}}
