{{range .}}
<div class="card">
  <div class="row">
    <div>
      <div class="name"><span class="dot"></span>{{.Username}}</div>
      <div class="meta">{{.MACAddress}}</div>
    </div>
    <div class="meta">{{.Remaining}} left</div>
  </div>
</div>
{{else}}
<div class="card"><p class="empty">No active sessions</p></div>
{{end}}
