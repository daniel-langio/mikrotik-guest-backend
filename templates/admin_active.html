<div class="card">
{{range .}}
  <div class="item">
    <div class="row">
      <div>
        <div class="name"><span class="dot"></span>{{.Username}}</div>
        <div class="meta">{{.Router}} &middot; {{if .OS}}{{.OS}} &middot; {{end}}{{if .Hostname}}{{.Hostname}} &middot; {{end}}{{.MACAddress}}</div>
      </div>
      <div class="row">
        <div class="meta countdown" data-expires="{{.ExpiresAt.Format "2006-01-02T15:04:05Z07:00"}}">&hellip;</div>
        <form hx-post="/admin/disconnect/{{.ID}}" hx-target="#active" hx-swap="innerHTML" hx-confirm="{{t "active.disc_q"}}">
          <button type="submit" class="btn-danger">{{t "active.disc"}}</button>
        </form>
      </div>
    </div>
  </div>
{{else}}
  <p class="empty">{{t "active.empty"}}</p>
{{end}}
</div>
