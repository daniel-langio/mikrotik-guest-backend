<!doctype html>
<html>
<head>
  <title>Aphrodite Guest Portal · Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css?v={{v}}">
  <script src="/static/htmx.min.js?v={{v}}"></script>
  <script src="/static/app.js?v={{v}}"></script>
</head>
<body>
  <div id="toast-container"></div>
  <div class="appbar">
    <div>
      <h1>Aphrodite</h1>
      <p class="subtitle">Guest Portal &middot; {{.Username}}</p>
    </div>
    <form method="post" action="/logout"><button type="submit">Log out</button></form>
  </div>
  <div class="page">
    <h2>Pending devices</h2>
    <div id="pending" hx-get="/admin/pending" hx-trigger="load, every 3s" hx-swap="innerHTML"></div>

    <h2>Active sessions</h2>
    <div id="active" hx-get="/admin/active" hx-trigger="load, every 5s" hx-swap="innerHTML"></div>
{{if .IsAdmin}}
    <h2>Operators</h2>
    <div id="users" hx-get="/admin/users" hx-trigger="load" hx-swap="innerHTML"></div>

    <h2>Login history</h2>
    <div id="history" hx-get="/admin/history" hx-trigger="load, every 30s" hx-swap="innerHTML"></div>
{{end}}
  </div>
</body>
</html>
