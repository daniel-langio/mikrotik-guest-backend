<!doctype html>
<html>
<head>
  <title>Aphrodite Guest Portal · Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/app.js"></script>
</head>
<body>
  <div id="toast-container"></div>
  <div class="page">
    <div class="titlebar">
      <div>
        <h1>Aphrodite</h1>
        <p class="subtitle">Guest Portal Admin</p>
      </div>
      <form method="post" action="/logout"><button type="submit">Log out</button></form>
    </div>

    <h2>Pending devices</h2>
    <div id="pending" hx-get="/admin/pending" hx-trigger="load, every 3s" hx-swap="innerHTML"></div>

    <h2>Active sessions</h2>
    <div id="active" hx-get="/admin/active" hx-trigger="load, every 5s" hx-swap="innerHTML"></div>
  </div>
</body>
</html>
