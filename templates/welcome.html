<!doctype html>
<html lang="{{lang}}">
<head>
  <title>Aphrodite · {{t "welcome.subtitle"}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css?v={{v}}">
  <script src="/static/htmx.min.js?v={{v}}"></script>
  {{template "i18n.html"}}
  <script src="/static/pay.js?v={{v}}"></script>
</head>
<body>
  <div class="page">
    <div class="card welcome-card">
      <h1>{{t "welcome.title"}}</h1>
      <p class="subtitle">{{t "welcome.subtitle"}}</p>
      <div class="badge">{{.Username}}</div>
      <div id="pay">{{template "pay.html" .}}</div>
      <p class="help-link"><a href="/help">{{t "help.link"}}</a></p>
      <p class="help-link"><a href="/privacy?s={{.ID}}&mac={{.MAC}}">{{t "privacy.link"}}</a></p>
      <div class="lang-wrap">{{template "langswitch.html"}}</div>
    </div>
  </div>
  {{if not .Accepted}}<div id="poller" hx-get="/welcome/status/{{.ID}}?g={{if .NeedConsent}}1{{else}}0{{end}}" hx-trigger="every 2s" hx-target="#pay" hx-swap="innerHTML"></div>{{end}}
</body>
</html>
