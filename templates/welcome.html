<!doctype html>
<html>
<head>
  <title>Aphrodite Guest Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css?v={{v}}">
  <script src="/static/htmx.min.js?v={{v}}"></script>
  <script src="/static/pay.js?v={{v}}"></script>
</head>
<body>
  <div class="page">
    <div class="card welcome-card">
      <h1>Welcome</h1>
      <p class="subtitle">Aphrodite Guest Portal</p>
      <div class="badge">{{.Username}}</div>
      <div id="pay">{{template "pay.html" .}}</div>
    </div>
  </div>
  <div hx-get="/welcome/status/{{.ID}}" hx-trigger="every 2s" hx-swap="none"></div>
</body>
</html>
