<div class="card">
{{range .}}
  <div class="item">
    <div class="name"><span class="dot" {{if not .Success}}style="background:#c0392b"{{end}}></span>{{.Username}} &middot; {{if .Success}}ok{{else}}failed{{end}}</div>
    <div class="meta"><span class="localtime" data-iso="{{.At.Format "2006-01-02T15:04:05Z07:00"}}">{{.At.Format "15:04:05"}}</span> &middot; {{.IP}} &middot; {{.UserAgent}}</div>
  </div>
{{else}}
  <p class="empty">No logins yet</p>
{{end}}
</div>
