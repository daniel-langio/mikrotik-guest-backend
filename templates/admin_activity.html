<div class="card">
{{range .}}
  <div class="item">
    <div class="name">{{.Username}} &rarr; {{if .Domain}}{{.Domain}}{{else}}{{.DstIP}}{{end}}{{if .DstPort}}:{{.DstPort}}{{end}} <span class="meta">{{.Proto}}</span></div>
    <div class="meta"><span class="localtime" data-iso="{{.LastSeen.Format "2006-01-02T15:04:05Z07:00"}}">{{.LastSeen.Format "15:04:05"}}</span> &middot; {{.Router}} &middot; {{.MAC}}{{if .Domain}} &middot; {{.DstIP}}{{end}} &middot; &uarr;{{bytes .Up}} &darr;{{bytes .Down}}</div>
  </div>
{{else}}
  <p class="empty">{{t "activity.empty"}}</p>
{{end}}
</div>
