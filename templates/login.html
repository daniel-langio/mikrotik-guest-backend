<!doctype html>
<html>
<head>
  <title>Aphrodite Guest Portal · Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css?v={{v}}">
</head>
<body>
  <div class="page">
    <div class="card welcome-card">
      <h1>Aphrodite</h1>
      <p class="subtitle">Guest Portal Admin</p>
      {{if .Error}}<p class="status-line" style="color:#c0392b">{{.Error}}</p>{{end}}
      <form method="post" action="/login" style="display:flex;flex-direction:column;gap:10px;margin-top:18px">
        <input type="text" name="username" placeholder="Username" autofocus required>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Log in</button>
      </form>
    </div>
  </div>
</body>
</html>
