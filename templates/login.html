<!doctype html>
<html lang="{{lang}}">
<head>
  <title>Aphrodite · {{t "login.subtitle"}}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css?v={{v}}">
</head>
<body>
  <div class="page">
    <div class="card welcome-card">
      <h1>Aphrodite</h1>
      <p class="subtitle">{{t "login.subtitle"}}</p>
      {{if .Error}}<p class="status-line" style="color:#c0392b">{{.Error}}</p>{{end}}
      <form method="post" action="/login" style="display:flex;flex-direction:column;gap:10px;margin-top:18px">
        <input type="text" name="username" placeholder="{{t "login.username"}}" autofocus required>
        <input type="password" name="password" placeholder="{{t "login.password"}}" required>
        <button type="submit">{{t "login.submit"}}</button>
      </form>
      <div class="lang-wrap">{{template "langswitch.html"}}</div>
    </div>
  </div>
</body>
</html>
