<div class="card">
{{if .Error}}<p class="status-line" style="color:#c0392b;padding:10px 18px">{{.Error}}</p>{{end}}
{{range .Users}}
  <div class="item">
    <div class="row">
      <div class="name">{{.Username}} <span class="meta">operator</span></div>
      <form hx-post="/admin/users/delete/{{.Username}}" hx-target="#users" hx-swap="innerHTML" hx-confirm="Delete operator {{.Username}}?">
        <button type="submit" class="btn-danger">Delete</button>
      </form>
    </div>
  </div>
{{else}}
  <p class="empty">No operators</p>
{{end}}
  <div class="item">
    <form class="approve-form" hx-post="/admin/users" hx-target="#users" hx-swap="innerHTML">
      <input type="text" name="username" placeholder="username" required>
      <input type="password" name="password" placeholder="password (8+)" required minlength="8">
      <button type="submit">Add operator</button>
    </form>
  </div>
</div>
